   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.36" y="170.748" transform="rotate(-0 18.36 170.748)">One channel is a shared point-objectness field. It does not encode fixed leaf identities or fixed keypoint slots.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.36" y="209.556" transform="rotate(-0 18.36 209.556)">No U-Net skip pyramid, no six-stage residual heatmap cascade, no Transformer query decoder in this implementation.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.36" y="248.364" transform="rotate(-0 18.36 248.364)">The geometric path decoder operates after detected points; it is not a layer inside this neural head.</text>
   </g>
