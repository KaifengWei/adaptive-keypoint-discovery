   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #24394a" x="26.73" y="269.688497" transform="rotate(-0 26.73 269.688497)">B  结构角色作用在教师侧</text>
